<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>大肥鱼 · 桌面伙伴</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main id="companion" class="companion" data-state="idle" aria-label="大肥鱼桌面宠物">
    <div id="bubble" class="bubble" role="status" aria-live="polite">今天也一起加油吧。</div>
    <div id="sparkles" class="sparkles" aria-hidden="true"><i>✦</i><i>♡</i><i>✧</i><i>♡</i><i>✦</i></div>
    <button id="character" class="character" aria-label="大肥鱼，拖动可移动，长按摸头，右键打开菜单" title="拖动移动 · 长按摸头 · 右键菜单">
      <span class="pet-art sprite-art" aria-hidden="true"></span>
    </button>
    <div class="nameplate"><span id="statusDot" class="status-dot"></span><span id="status">大肥鱼在陪你</span></div>
    <nav class="actions" aria-label="桌宠互动">
      <button id="feed" class="action"><span aria-hidden="true">🍚</span>喂食</button>
      <button id="pet" class="action"><span aria-hidden="true">♡</span>摸头</button>
      <button id="more" class="action more" aria-label="更多操作">···</button>
    </nav>
    <div id="menu" class="menu" hidden>
      <span class="menu-title">大肥鱼 · 你的桌面伙伴</span>
      <p id="connection" class="connection">正在连接 DSH…</p>
      <button id="openClient" hidden>打开插件页面 ↗</button>
      <button id="resetPosition">回到右下角</button>
      <button id="hidePet">收起桌宠</button>
      <small>拖动移动 · 长按摸头</small>
    </div>
  </main>
  <button id="restore" class="restore" hidden aria-label="显示大肥鱼">🐋</button>
  <script src="pet.js"></script>
</body>
</html>
